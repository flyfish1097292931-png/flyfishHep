name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Installed-package tests and reviewed examples
        run: |
          CHECK_DIR=$(mktemp -d)
          cp -R tests examples scripts "$CHECK_DIR/"
          cd "$CHECK_DIR"
          python -c "import pathlib, flyfishhep; assert 'site-packages' in pathlib.Path(flyfishhep.__file__).parts, flyfishhep.__file__"
          python -B -m unittest discover -s tests -v
          python scripts/smoke_examples.py --allow-exec
