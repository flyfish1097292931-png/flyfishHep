<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Finite-cutoff approximation error</title>
<desc id="desc">Logarithmic axes. Actual UV approximation error and leading quadratic correction, with the predeclared 1e-8 length tolerance. Quadrature error is reported separately in the table.</desc>
<rect width="760" height="430" fill="#ffffff"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#233348">
<text x="85" y="27" font-size="17">Finite cutoff: approximation error, not integration error</text>
<line x1="85" y1="55.00" x2="665" y2="55.00" stroke="#e1e6ed"/>
<text x="25" y="59.00">1e0</text>
<line x1="85" y1="118.33" x2="665" y2="118.33" stroke="#e1e6ed"/>
<text x="25" y="122.33">1e-2</text>
<line x1="85" y1="181.67" x2="665" y2="181.67" stroke="#e1e6ed"/>
<text x="25" y="185.67">1e-4</text>
<line x1="85" y1="245.00" x2="665" y2="245.00" stroke="#e1e6ed"/>
<text x="25" y="249.00">1e-6</text>
<line x1="85" y1="308.33" x2="665" y2="308.33" stroke="#e1e6ed"/>
<text x="25" y="312.33">1e-8</text>
<text x="85.00" y="365" text-anchor="middle">0.005</text>
<text x="187.77" y="365" text-anchor="middle">0.01</text>
<text x="323.62" y="365" text-anchor="middle">0.025</text>
<text x="426.38" y="365" text-anchor="middle">0.05</text>
<text x="529.15" y="365" text-anchor="middle">0.1</text>
<text x="665.00" y="365" text-anchor="middle">0.25</text>
<polyline points="85.00,185.62 187.77,166.56 323.62,141.37 426.38,122.34 529.15,103.43 665.00,79.21" fill="none" stroke="#176087" stroke-width="2.5"/>
<polyline points="85.00,185.62 187.77,166.56 323.62,141.35 426.38,122.29 529.15,103.22 665.00,78.02" fill="none" stroke="#d17c26" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="85.00" cy="185.62" r="4" fill="#176087"/>
<circle cx="187.77" cy="166.56" r="4" fill="#176087"/>
<circle cx="323.62" cy="141.37" r="4" fill="#176087"/>
<circle cx="426.38" cy="122.34" r="4" fill="#176087"/>
<circle cx="529.15" cy="103.43" r="4" fill="#176087"/>
<circle cx="665.00" cy="79.21" r="4" fill="#176087"/>
<line x1="85" y1="308.33" x2="665" y2="308.33" stroke="#a34242" stroke-dasharray="3 4"/>
<text x="450" y="300.33" fill="#a34242">declared absolute gate: 1e-8</text>
<text x="375" y="393" text-anchor="middle">epsilon / ell (dimensionless, log scale)</text>
<text x="85" y="420" fill="#176087">● numerical length − UV logarithm</text>
<text x="420" y="420" fill="#b86b1b">– – leading correction 2 L (epsilon/ell)^2</text>
</g></svg>
